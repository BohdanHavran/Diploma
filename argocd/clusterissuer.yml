apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-argocd
  namespace: argocd
spec:
  acme:
    email: diploma@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-argocd
    solvers:
      - http01:
          ingress:
            class: nginx