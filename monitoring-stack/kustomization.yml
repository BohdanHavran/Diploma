resources:
  - ./app
  - clusterissuer.yml
  - ingress.yml

helmCharts:
  - name: kube-prometheus-stack
    releaseName: monitoring-stack
    repo: https://prometheus-community.github.io/helm-charts
    namespace: monitoring-stack
    version: 72.9.0
    valuesFile: kube-prometheus-stack-values.yml

  - name: prometheus-operator-crds
    releaseName: monitoring-stack
    repo: https://prometheus-community.github.io/helm-charts
    namespace: monitoring-stack
    version: 20.0.1
    valuesFile: prometheus-operator-values.yml

  - name: keda
    releaseName: keda
    repo: https://kedacore.github.io/charts
    namespace: monitoring
    version: 2.17.1
    valuesFile: keda-values.yml

