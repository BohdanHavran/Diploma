apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-grafana
  namespace: monitoring-stack
spec:
  acme:
    email: diploma@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-grafana
    solvers:
      - http01:
          ingress:
            class: nginx