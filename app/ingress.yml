apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-server-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-frontend
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/use-regex: 'true'
spec:
  ingressClassName: nginx
  rules:
  - host: diplom.dns.army
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app-service
            port:
              name: http
  tls:
  - hosts:
    - diplom.dns.army
    secretName: app-server-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-server-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-backend
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/use-regex: 'true'
spec:
  ingressClassName: nginx
  rules:
  - host: api.diplom.dns.army
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              name: http
  tls:
  - hosts:
    - api.diplom.dns.army
    secretName: api-server-tls