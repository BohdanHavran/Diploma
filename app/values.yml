    metadata:
      serverAddress: http://monitoring-stack-kube-prom-prometheus.monitoring-stack:9090
      metricName: container_cpu_usage
      query: sum(node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate5m{namespace="{{ .Release.Namespace }}", pod=~"{{ $comp.deployment.name }}", container!=""}) by (container)
