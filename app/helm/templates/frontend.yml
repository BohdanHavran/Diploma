{{- if .Values.frontend.deployment.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.frontend.deployment.name }}
spec:
  replicas: {{ .Values.frontend.deployment.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.frontend.deployment.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.frontend.deployment.name }}
    spec:
      containers:
      - name: {{ .Values.frontend.deployment.name }}
        image: {{ .Values.frontend.deployment.containers.image }}
        ports:
        - containerPort: {{ .Values.frontend.deployment.containers.ports.containerPort }}
{{- end }} 
---
{{- if .Values.frontend.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.frontend.service.name }}
spec:
  selector:
    app: {{ .Values.frontend.deployment.name }}
  ports:
    - name: {{ .Values.frontend.service.ports.name }}
      protocol: {{ .Values.frontend.service.ports.protocol }}
      port: {{ .Values.frontend.service.ports.port }}
      targetPort: {{ .Values.frontend.service.ports.targetPort }}
{{- end }} 